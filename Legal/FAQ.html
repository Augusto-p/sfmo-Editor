<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/App/Icon/app.ico" type="image/x-icon">
</head>
<body>
    <script>
        const searchParams = new URLSearchParams(window.location.search);
        searchParams.set("legalref", "FAQ");
        const searchString = new URLSearchParams(searchParams).toString();
        const newUrl = `${window.location.pathname.split("/Legal/")[0]}/?${searchString}${window.location.hash}`;
        const link = document.createElement('a');
        link.style.opacity = 0;
        link.href = newUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    </script>
</body>

</html>
