    <script>
        let Lang_Dictionary = {}
        let Lang = "EN";
        async function getLang_Dictionary() {
            const params = Object.fromEntries(new URLSearchParams(window.location.search));
            if (params["lang"]) {
                Lang = params["lang"];
                window.localStorage.setItem("Lang", Lang);
            } else {
                Lang = window.localStorage.getItem("Lang") ?? "EN";
                const searchParams = new URLSearchParams(window.location.search)
                searchParams.set("lang", Lang);
                const searchString = searchParams.toString();
                const newUrl = `${window.location.pathname}?${searchParams.toString()}${window.location.hash}`;
                window.history.pushState({}, "", newUrl.replaceAll("//", "/"));

            }
            if (!["ES", "EN"].includes(Lang)) { "EN" }
            let res = await fetch(`lang/${Lang}.json`);
            let data = await res.json();
            Lang_Dictionary = data;
            LoadLang();
        }
        function LoadLang() {
            HeaderLoadLang();
            BookmarkLoadLang();
            LoadFileLoadLang();
            columns_editor.LoadLang();
            document.querySelectorAll("custom-dashboard").forEach(e => { e.LoadLang();});
            dashboard_new_LoadLang();
            toggle_switchLoadLang();
            dataView.LoadLang();
        }
    </script>

<script>
    getLang_Dictionary().then(() => {
        LoadLang();
        const LegalParams = Object.fromEntries(new URLSearchParams(window.location.search));
        if (LegalParams["legalref"]) {
            let value = LegalParams["legalref"];
            const searchParams = new URLSearchParams(window.location.search);
            searchParams.delete("legalref")
            const searchString = searchParams.toString();
            const newUrl = `${window.location.pathname.split("/Legal/")[0]}/Legal/Terms_of_Service?${searchString}${window.location.hash}`;
            window.history.pushState({}, "", newUrl.replaceAll("//", "/"));
            switch (value) {
                case "FAQ":
                    ViewFAQ();
                    break;
                case "Privacy_Policy":
                    ViewPrivacyPolicy();
                    break;
                case "Terms_of_Service":
                    ViewTermsOfService();
                    break;
                default:
                    break;
            }
        }

    })
</script>
